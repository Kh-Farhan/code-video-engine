title: Why NEXT_PUBLIC env vars ignore your runtime config

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: Your env var is frozen at build
    subheading: NEXT_PUBLIC_ in Next.js
    narration: >-
      Next public variables are frozen at build time. Restarting the server
      will not change them.

  - type: code
    language: javascript
    code: |
      // your code
      const url =
        process.env.NEXT_PUBLIC_API_URL;

      // after next build
      const url = "https://old.api.com";
    highlight:
      - { from: 2, to: 3, cue: process }
      - { from: 5, to: 5, cue: build }
      - { from: 6, to: 6, cue: string }
    narration: >-
      Your code reads process dot env. After next build, that line is a
      hardcoded string.

  - type: flow
    steps:
      - next build
      - Staging
      - Production
    narration: >-
      Build one Docker image, promote it to staging and production, and both
      ship the same old URL.

  - type: list
    items:
      - Build per environment
      - Read it on the server
      - Serve it from an API
    narration: >-
      Three fixes: a build for each environment, a server read passed down as
      props, or a small config endpoint.

  - type: outro
    cta: Public env vars are build time
    narration: >-
      So before you edit that variable again, remember:
