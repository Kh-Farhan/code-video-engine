title: Why NEXT_PUBLIC env vars ignore your runtime config

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Why NEXT_PUBLIC env vars ignore runtime config
  hook: You changed the API URL in production. The browser still calls the old one.
  summary: Next.js replaces NEXT_PUBLIC_ variables with literal strings during next build, so one image keeps its build time values in every environment. Read per deploy values on the server after await connection() and pass them down as props.
  fixCode: |-
    import { connection } from 'next/server';

    export default async function Page() {
      await connection();
      const url = process.env.API_URL;
      return <Client apiUrl={url} />;
    }
  topicTags:
    - nextjs
    - docker
  level: advanced

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: You changed the env var. Nothing changed.
    subheading: Next.js
    narration: >-
      You change the API URL in production and restart the server, but the
      browser keeps calling the old one.

  - type: code
    language: javascript
    code: |
      // your code
      const url =
        process.env.NEXT_PUBLIC_API_URL;

      // after next build
      const url = "https://old.api.com";
    highlight:
      - { from: 5, to: 5, cue: build }
      - { from: 2, to: 3, cue: process }
      - { from: 6, to: 6, cue: string }
    narration: >-
      Why? [pause] Next public variables are not read at runtime. During next
      build, Next.js replaces process dot env with the literal string, baked
      into the browser JavaScript.

  - type: flow
    steps:
      - next build
      - Staging
      - Production
    narration: >-
      Build one Docker image and promote it to staging and production. Both
      serve the URL from build time.

  - type: code
    language: tsx
    code: |
      import { connection } from 'next/server';

      export default async function Page() {
        await connection();
        const url = process.env.API_URL;
        return <Client apiUrl={url} />;
      }
    highlight:
      - { from: 5, to: 5, cue: prefix }
      - { from: 4, to: 4, cue: connection }
      - { from: 6, to: 6, cue: prop }
    narration: >-
      For values that change per deploy, drop the prefix and read them on the
      server. Await connection, so it runs at request time, then pass the value
      down as a prop.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: next public is fixed at build, not deploy. Which env var
      bit you? Follow Frontend Gotchas for more.
