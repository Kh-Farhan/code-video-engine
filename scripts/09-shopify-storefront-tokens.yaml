title: Public vs private Storefront API tokens

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: NEXT_PUBLIC leaks your private token
    subheading: Headless Shopify on Next.js
    narration: >-
      Prefix your private Storefront token with next public, and it ships to
      every visitor.

  - type: code
    language: typescript
    code: |
      // bundled into the browser
      process.env.NEXT_PUBLIC_SHOPIFY_PRIVATE_TOKEN;

      // server only
      process.env.SHOPIFY_PRIVATE_TOKEN;
    highlight:
      - { from: 1, to: 2, cue: bundled }
      - { from: 4, to: 5, cue: prefix }
    narration: >-
      Next public variables are bundled into browser JavaScript. Drop the
      prefix to keep it server side.

  - type: flow
    steps:
      - Browser
      - Route handler
      - Storefront API
    narration: >-
      The browser calls your route handler, and only the handler holds the
      private token.

  - type: keyword
    keyword: ROTATE IT
    narration: >-
      Already shipped it? Treat it as leaked.

  - type: outro
    cta: Private tokens never get the prefix
    narration: >-
      Check your env file now, because
