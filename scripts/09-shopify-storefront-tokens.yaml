title: Public vs private Storefront API tokens

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: NEXT_PUBLIC leaks your Shopify Storefront private token
  hook: Any visitor can open DevTools and copy your private Shopify token.
  summary: Next.js inlines every NEXT_PUBLIC_ value into the browser JavaScript at build time, so the token sits in the bundle in plain text. Read the private token only in server code like a route handler, and have the browser call your route.
  fixCode: |-
    // app/api/products/route.ts
    process.env.SHOPIFY_PRIVATE_TOKEN
  topicTags:
    - shopify
    - nextjs
  level: intermediate

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: Your Shopify token, visible in DevTools
    subheading: Headless Shopify on Next.js
    narration: >-
      Anyone can copy your token.

  - type: code
    language: typescript
    code: |
      // you write
      process.env.NEXT_PUBLIC_SHOPIFY_TOKEN

      // next build ships
      "9f2c41e7d0..."
    highlight:
      - { from: 1, to: 2, cue: instruction }
      - { from: 4, to: 5, cue: literal }
    narration: >-
      Any visitor can open DevTools and see it, because you prefixed it with
      next public. Why is it in the browser at all? [pause] Next public is an
      instruction, not a setting. At next build, Next.js swaps each reference
      for the literal value and inlines it into the browser JavaScript.

  - type: output
    title: DevTools Sources
    lines:
      - "search: 9f2c41e7"
      - "1 match"
      - "  \"9f2c41e7d0...\""
    narration: >-
      Search the bundle, and the token sits there in plain text.

  - type: compare
    language: typescript
    wrong:
      code: |
        // client component
        process.env.NEXT_PUBLIC_SHOPIFY_TOKEN
    right:
      code: |
        // app/api/products/route.ts
        process.env.SHOPIFY_PRIVATE_TOKEN
    narration: >-
      Drop the prefix and read the token only in server code, like a route
      handler. The browser calls your route, never Shopify directly.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: next public means public. Have you checked your bundle?
      Follow Frontend Gotchas for more.
