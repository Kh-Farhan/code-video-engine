title: Why changing useRef does not update your screen

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Why changing useRef does not re-render in React
  hook: You click the counter five times, and the button still says zero.
  summary: Changing ref.current never tells React anything, so the component does not re-render and the screen shows the old value. Keep anything you display in state, because calling the setter is how React learns it changed.
  fixCode: |-
    const [count, setCount] = useState(0);
    setCount(c => c + 1);
  topicTags:
    - react
    - javascript
  level: beginner

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: "Clicked 5 times. Still shows 0."
    subheading: React
    narration: >-
      Five clicks. Still zero.

  - type: code
    language: tsx
    code: |
      function Counter() {
        const count = useRef(0);
        const add = () => {
          count.current += 1;
        };
        return (
          <button onClick={add}>{count.current}</button>
        );
      }
    highlight:
      - { from: 2, to: 2, cue: ref }
      - { from: 4, to: 4, cue: current }
      - { from: 7, to: 7, cue: button }
    narration: >-
      You click the counter five times, and the button still says zero. Why?
      [pause] Count is a ref. Changing current never tells React, so the button
      never renders again.

  - type: stat
    from: "5"
    value: "0"
    label: on screen after five clicks
    narration: >-
      Log it and you get five. The screen still shows zero.

  - type: compare
    language: tsx
    wrong:
      code: |
        const count = useRef(0);
        count.current += 1;
    right:
      code: |
        const [count, setCount] = useState(0);
        setCount(c => c + 1);
    narration: >-
      Use state for anything you show. Calling the setter tells React to
      render again.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: if it shows on screen, it is state. Have you shipped this
      bug? Follow Frontend Gotchas for more.
