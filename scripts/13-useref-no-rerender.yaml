title: Why changing useRef does not update your screen

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: Your ref changed. The screen did not.
    subheading: useRef vs useState in React
    narration: >-
      You click a counter five times. The value goes up, but the screen still
      says zero.

  - type: code
    language: tsx
    code: |
      function Counter() {
        const count = useRef(0);
        const add = () => {
          count.current += 1;
        };
        return (
          <button onClick={add}>{count.current}</button>
        );
      }
    highlight:
      - { from: 2, to: 2, cue: object }
      - { from: 4, to: 4, cue: current }
      - { from: 7, to: 7, cue: button }
    narration: >-
      A ref is a plain JavaScript object that React keeps between renders.
      When you change current, React is never told, so it does not re-render,
      and the button keeps showing zero.

  - type: stat
    from: "5"
    value: "0"
    label: on screen after five clicks
    narration: >-
      Log count dot current and you get five. The screen still shows zero.

  - type: compare
    language: tsx
    wrong:
      code: |
        const count = useRef(0);
        count.current += 1;
    right:
      code: |
        const [count, setCount] = useState(0);
        setCount(c => c + 1);
    narration: >-
      Use state for anything you show. Calling the setter is how React learns
      something changed, so it renders again.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: if it shows on screen, it is state. Refs are for things
      like timer IDs. Follow Frontend Gotchas for more.
