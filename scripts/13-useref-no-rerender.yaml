title: Why changing useRef does not update your screen

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: Your ref changed. The screen did not.
    subheading: useRef vs useState in React
    narration: >-
      Changing a ref never re-renders your component. The value moves, the
      screen does not.

  - type: code
    language: tsx
    code: |
      function Counter() {
        const count = useRef(0);
        const add = () => {
          count.current += 1;
        };
        return (
          <button onClick={add}>
            {count.current}
          </button>
        );
      }
    highlight:
      - { from: 2, to: 2, cue: useRef }
      - { from: 4, to: 4, cue: current }
      - { from: 7, to: 9, cue: button }
    narration: >-
      The count lives in useRef. Adding to current mutates it silently. React
      never hears about it, so the button keeps rendering zero.

  - type: stat
    value: "0"
    label: on screen after five clicks
    narration: >-
      Click five times. The ref holds five. The screen?

  - type: compare
    wrong:
      label: Rendered value in useRef
    right:
      label: Rendered value in useState
    narration: >-
      Refs are for timer IDs and DOM nodes. Anything you render belongs in
      state.

  - type: outro
    cta: On screen? Use state.
    narration: >-
      Put it back in a ref, and remember:
