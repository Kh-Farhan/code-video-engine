title: Why setCount(count + 1) three times only adds one

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Why setCount 3 times only adds 1 in React
  hook: You call setCount three times. The count goes up by one.
  summary: count is a snapshot of the current render, so all three calls read the same old value and set the same result. An updater function gets the latest value each time, so every call counts.
  fixCode: setCount(c => c + 1);
  topicTags:
    - react
    - javascript

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: setCount ran 3 times. Count went up by 1.
    subheading: React state gotcha
    narration: >-
      Three setCount calls, and the count only goes up by one.

  - type: code
    language: tsx
    code: |
      function handleClick() {
        setCount(count + 1);
        setCount(count + 1);
        setCount(count + 1);
      }
    highlight:
      - { from: 2, to: 2, cue: first }
      - { from: 3, to: 3, cue: second }
      - { from: 4, to: 4, cue: third }
    narration: >-
      Count is a snapshot. The first call reads zero, the second reads zero,
      and the third reads zero too.

  - type: compare
    language: tsx
    wrong:
      code: |
        setCount(count + 1);
    right:
      code: |
        setCount(c => c + 1);
    narration: >-
      Pass an updater instead. React feeds each one the latest value.

  - type: stat
    from: "+1"
    value: "+3"
    label: per click
    narration: >-
      Now each click adds three.

  - type: outro
    cta: Follow for more gotchas
    narration: Follow Frontend Gotchas for more.
