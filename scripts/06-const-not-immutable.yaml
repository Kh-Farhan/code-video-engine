title: const does not make objects immutable

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: const doesn't mean immutable
    subheading: JavaScript
    narration: >-
      Const never made your object immutable. It only locks the variable.

  - type: code
    language: javascript
    code: |
      const user = { name: 'Ali' };
      user.name = 'Sara';   // works
      user = {};            // TypeError
    highlight:
      - { from: 1, to: 1, cue: const }
      - { from: 2, to: 2, cue: property }
      - { from: 3, to: 3, cue: reassigning }
    narration: >-
      With const, you can still change a property. Only reassigning the
      variable throws.

  - type: code
    language: javascript
    code: |
      const user = Object.freeze({
        name: 'Ali',
        address: { city: 'Lahore' },
      });
      user.name = 'Sara';            // blocked
      user.address.city = 'Karachi'; // still works
    highlight:
      - { from: 1, to: 4, cue: freeze }
      - { from: 5, to: 5, cue: top }
      - { from: 6, to: 6, cue: nested }
    narration: >-
      Object dot freeze blocks changes at the top level. But it is shallow,
      so the nested city still changes.

  - type: compare
    wrong:
      label: const locks the value
    right:
      label: const locks the binding
    narration: >-
      Const guards the name. Freeze guards one level. Neither goes deep.

  - type: outro
    cta: Binding, not value
    narration: >-
      So next time a const object changes, remember:
