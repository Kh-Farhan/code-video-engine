title: const does not make objects immutable

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: It's const. Its name still changed.
    subheading: JavaScript
    narration: >-
      You declare an object with const and expect it to be locked. Then some
      function changes its name anyway.

  - type: flow
    steps:
      - const user
      - reference
      - "{ name: 'Ali' }"
    narration: >-
      Const locks the binding, the arrow from the name user to one object. The
      object at the end of that arrow is still fully editable.

  - type: output
    title: Console
    lines:
      - "> user.name = 'Sara'"
      - "'Sara'"
      - "> user = {}"
      - "TypeError: Assignment to constant variable."
    narration: >-
      So changing user dot name just works. Only pointing user at a new object
      throws.

  - type: code
    language: javascript
    code: |
      const user = Object.freeze({
        name: 'Ali',
        address: { city: 'Lahore' },
      });
      user.name = 'Sara';            // fails
      user.address.city = 'Karachi'; // works
    highlight:
      - { from: 1, to: 4, cue: freeze }
      - { from: 5, to: 5, cue: name }
      - { from: 6, to: 6, cue: nested }
    narration: >-
      To lock the object, use Object dot freeze. It makes every property read
      only, so writing name fails. But freeze is shallow, and the nested
      address can still change.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: const stops reassignment, freeze stops edits, and neither
      goes deep. Follow Frontend Gotchas for more.
