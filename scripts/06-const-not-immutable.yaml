title: const does not make objects immutable

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: JavaScript const does not make objects immutable
  hook: You declared user with const, and user.name still changed.
  summary: const only locks the binding from the name to the object, so the object's properties can still change. Object.freeze stops edits, but only one level deep.
  fixCode: |-
    const user = Object.freeze({ name: 'Ali' });
    user.name = 'Sara'; // fails
  topicTags:
    - javascript
  level: beginner

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: It's const. user.name still changed.
    subheading: JavaScript
    narration: >-
      It's const. It still changed.

  - type: output
    title: Console
    lines:
      - "> user.name = 'Sara'"
      - "'Sara'"
      - "> user = {}"
      - "TypeError: Assignment to constant variable."
    narration: >-
      You declare user with const, and user dot name still changes from Ali to
      Sara. So which line throws? [pause] Only the second. Const locks the name
      user to one object, not what is inside it.

  - type: code
    language: javascript
    code: |
      const user = Object.freeze({
        name: 'Ali',
        address: { city: 'Lahore' },
      });
      user.name = 'Sara';            // fails
      user.address.city = 'Karachi'; // works
    highlight:
      - { from: 1, to: 4, cue: freeze }
      - { from: 5, to: 5, cue: name }
      - { from: 6, to: 6, cue: nested }
    narration: >-
      To lock the contents, use Object dot freeze, and writing name fails. But
      it is shallow, so nested objects still change.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: const stops reassignment, freeze stops edits, and neither
      goes deep. Did you think const meant frozen? Follow Frontend Gotchas for
      more.
