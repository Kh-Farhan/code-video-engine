title: Why your Shopify Storefront API cart keeps resetting

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: Your cart is not resetting
    subheading: You are making a new one
    narration: >-
      Your Shopify cart is not resetting. You are creating a new one.

  - type: flow
    steps:
      - Page load
      - cartCreate()
      - New empty cart
    narration: >-
      Refresh, and the page asks Shopify for a cart from scratch. The old one
      is simply forgotten.

  - type: code
    language: typescript
    code: |
      // Runs on every page load
      async function getCart() {
        const cart = await cartCreate();
        return cart;
      }
    highlight:
      - { from: 2, to: 2, cue: getCart }
      - { from: 1, to: 1, cue: load }
      - { from: 3, to: 3, cue: cartCreate }
    narration: >-
      Here is the culprit: getCart runs on every load and calls cartCreate,
      which always returns an empty cart.

  - type: code
    language: typescript
    typing: true
    code: |
      async function getCart(cookies) {
        const id = cookies.get("cartId");
        if (id) {
          const saved = await fetchCart(id);
          if (saved) return saved;
        }
        const cart = await cartCreate();
        cookies.set("cartId", cart.id);
        return cart;
      }
    highlight:
      - { from: 2, to: 2, cue: cookie }
      - { from: 3, to: 6, cue: reuse }
      - { from: 7, to: 8, cue: create }
    narration: >-
      The fix: read the cart ID from a cookie. If that cart still exists,
      reuse it. Otherwise create one and save its ID.

  - type: list
    items:
      - ID only in React state
      - localStorage in a server render
      - Cart ID missing its key
      - Null cart after checkout
    narration: >-
      Also check for state that dies on refresh, storage the server cannot
      read, a cut off key, and carts closed by checkout.

  - type: outro
    cta: Create once, reuse the ID
    narration: >-
      Skip the cookie, and remember:
