title: "'use client' does not mean client only"

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: "'use client' still renders on the server"
    subheading: Next.js App Router
    narration: >-
      Client components still render on the server first.

  - type: code
    language: tsx
    code: |
      'use client';

      export function Counter() {
        const [count, setCount] = useState(0);
        return <button onClick={() => setCount(count + 1)}>{count}</button>;
      }
    highlight:
      - { from: 1, to: 1, cue: use client }
      - { from: 5, to: 5, cue: button }
    narration: >-
      This file says use client, yet its button still arrives as server HTML.

  - type: flow
    steps:
      - Server renders HTML
      - Browser loads JS
      - Hydrates
    narration: >-
      On first load, the server renders them to HTML. Then the browser loads
      their JavaScript and hydrates them.

  - type: keyword
    keyword: BOUNDARY, NOT PLACE
    narration: >-
      The directive marks a boundary. Its imports ship to the browser.

  - type: compare
    language: tsx
    wrong:
      code: |
        const theme = localStorage.getItem("t");
    right:
      code: |
        useEffect(() => {
          setTheme(localStorage.getItem("t"));
        }, []);
    narration: >-
      So reading localStorage during render crashes on the server. Read it
      inside an effect.

  - type: outro
    cta: A boundary, not a location
    narration: >-
      Next time you add use client, remember:
