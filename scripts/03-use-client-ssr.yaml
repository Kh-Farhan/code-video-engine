title: "'use client' does not mean client only"

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: "'use client' still renders on the server"
    subheading: Next.js App Router
    narration: >-
      You mark a component use client and expect it to run only in the
      browser. Then it crashes on the server.

  - type: flow
    steps:
      - Server renders HTML
      - Browser loads JS
      - React hydrates
    narration: >-
      Client components are still prerendered to HTML on the server. Then the
      browser downloads their JavaScript and hydrates that HTML.

  - type: code
    language: tsx
    code: |
      'use client';

      export function ThemeToggle() {
        const t = window.localStorage.getItem("t");
        return <button>{t}</button>;
      }
    highlight:
      - { from: 1, to: 1, cue: boundary }
      - { from: 4, to: 4, cue: window }
    narration: >-
      Use client marks a boundary. This file and its imports also ship to the
      browser, but it never means browser only. So this read of window runs on
      the server too.

  - type: output
    title: Server log
    command: next dev
    lines:
      - "GET / 500"
      - "ReferenceError: window is not defined"
    narration: >-
      And on the server, there is no window.

  - type: compare
    language: tsx
    wrong:
      code: |
        const t = window.localStorage.getItem("t");
    right:
      code: |
        useEffect(() => {
          setT(window.localStorage.getItem("t"));
        }, []);
    narration: >-
      Move it into an effect. Effects only run in the browser, after the
      component mounts, so window is always there.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: use client decides what ships, not where it renders.
      Follow Frontend Gotchas for more.
