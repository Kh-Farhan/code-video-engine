title: "'use client' does not mean client only"

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Next.js use client still renders on the server
  hook: You marked it use client, and the server still says window is not defined.
  summary: Client components are still prerendered to HTML on the server and then hydrated in the browser, so window does not exist on that first render. Read browser APIs inside useEffect, which only runs in the browser after mount.
  fixCode: |-
    useEffect(() => {
      setT(window.localStorage.getItem("t"));
    }, []);
  topicTags:
    - nextjs
    - react
  level: intermediate

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: "'use client'. window is not defined."
    subheading: Next.js App Router
    narration: >-
      Client code crashes the server.

  - type: flow
    steps:
      - Server renders HTML
      - Browser loads JS
      - React hydrates
    narration: >-
      The error says window is not defined. Why does the server run it?
      [pause] Client components are still prerendered to HTML there. Then the
      browser loads their JavaScript and hydrates it.

  - type: code
    language: tsx
    code: |
      'use client';

      export function ThemeToggle() {
        const t = window.localStorage.getItem("t");
        return <button>{t}</button>;
      }
    highlight:
      - { from: 1, to: 1, cue: boundary }
      - { from: 4, to: 4, cue: window }
    narration: >-
      Use client marks a boundary: this file and its imports ship to the
      browser. It never means browser only, so this read of window runs on the
      server too.

  - type: output
    title: Server log
    command: next dev
    lines:
      - "ReferenceError: window is not defined"
    narration: >-
      And on the server, there is no window.

  - type: compare
    language: tsx
    wrong:
      code: |
        const t = window.localStorage.getItem("t");
    right:
      code: |
        useEffect(() => {
          setT(window.localStorage.getItem("t"));
        }, []);
    narration: >-
      Move the window read into an effect. Effects only run in the browser,
      after the component mounts, so window is always there.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: use client decides what ships, not where it renders.
      Which file crashed for you? Follow Frontend Gotchas for more.
