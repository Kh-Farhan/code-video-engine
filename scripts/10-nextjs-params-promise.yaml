title: In Next.js 15+, params is a Promise

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: params is a Promise now
    subheading: Next.js 15 App Router
    narration: >-
      In Next.js fifteen, params is a promise. Reading it directly is the old
      way.

  - type: compare
    language: tsx
    wrong:
      code: |
        function Page({ params }) {
          return <h1>{params.slug}</h1>;
        }
    right:
      code: |
        async function Page({ params }) {
          const { slug } = await params;
          return <h1>{slug}</h1>;
        }
    narration: >-
      Make the page async and await params before you read the slug.

  - type: code
    language: tsx
    code: |
      export default async function Page({
        params,
      }: {
        params: Promise<{ slug: string }>;
      }) {
        const { slug } = await params;
        return <h1>{slug}</h1>;
      }
    highlight:
      - { from: 4, to: 4, cue: type }
      - { from: 6, to: 6, cue: read }
    narration: >-
      Type it as a promise too, so TypeScript flags every direct read.

  - type: list
    items:
      - searchParams
      - cookies()
      - headers()
    narration: >-
      Three more APIs got the same treatment.

  - type: output
    command: npx @next/codemod@canary next-async-request-api .
    lines:
      - Transforming files...
      - Done
    narration: >-
      And a codemod rewrites most of it for you.

  - type: outro
    cta: Await params, then read
    narration: >-
      Skip the await, and remember:
