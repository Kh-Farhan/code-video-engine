title: In Next.js 15+, params is a Promise

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: params.slug is undefined
    subheading: Next.js 16 App Router
    narration: >-
      You upgrade to Next.js sixteen, and params dot slug suddenly comes back
      undefined.

  - type: output
    title: Console
    lines:
      - "> params instanceof Promise"
      - "true"
      - "> params.slug"
      - "undefined"
      - "> (await params).slug"
      - "'hello-world'"
    narration: >-
      Since version fifteen, params is a promise, a box for a value you have
      to wait for. The box has no slug property. Only the value inside does.

  - type: keyword
    keyword: NO MORE FALLBACK
    narration: >-
      Fifteen still let you read it directly, for a while. Sixteen removed
      that.

  - type: code
    language: tsx
    code: |
      export default async function Page({
        params,
      }: {
        params: Promise<{ slug: string }>;
      }) {
        const { slug } = await params;
        return <h1>{slug}</h1>;
      }
    highlight:
      - { from: 1, to: 1, cue: async }
      - { from: 4, to: 4, cue: type }
      - { from: 6, to: 6, cue: await }
    narration: >-
      Make the page async. Type params as a promise, so TypeScript flags any
      direct read. Then await it, and the slug is right there.

  - type: output
    command: npx @next/codemod@canary next-async-request-api .
    lines:
      - "params, searchParams"
      - "cookies(), headers(), draftMode()"
    narration: >-
      Search params, cookies, headers and draft mode work the same way, and a
      codemod migrates them.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: in the App Router, request data is a promise. Await it.
      Follow Frontend Gotchas for more.
