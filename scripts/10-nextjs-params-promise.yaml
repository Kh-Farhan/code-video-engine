title: In Next.js 15+, params is a Promise

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Next.js params.slug undefined? params is a Promise
  hook: You upgrade to Next.js 16 and params.slug comes back undefined.
  summary: Next.js 15 made params a Promise with temporary synchronous compatibility, and Next.js 16 removed that fallback. Make the page async, type params as a Promise and await it.
  fixCode: const { slug } = await params;
  topicTags:
    - nextjs
    - typescript
  level: intermediate

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: "Next.js 16: params.slug is undefined."
    subheading: Next.js App Router
    narration: >-
      Params dot slug is undefined.

  - type: output
    title: Console
    lines:
      - "> params instanceof Promise"
      - "true"
      - "> params.slug"
      - "undefined"
      - "> (await params).slug"
      - "'hello-world'"
    narration: >-
      It broke when you upgraded to Next.js sixteen. Why? [pause] Since version
      fifteen, params is a promise. The promise has no slug, only the value
      inside it does.

  - type: keyword
    keyword: NO MORE FALLBACK
    narration: >-
      Fifteen still let you read it directly. Sixteen removed that.

  - type: code
    language: tsx
    code: |
      export default async function Page({
        params,
      }: {
        params: Promise<{ slug: string }>;
      }) {
        const { slug } = await params;
        return <h1>{slug}</h1>;
      }
    highlight:
      - { from: 1, to: 1, cue: async }
      - { from: 4, to: 4, cue: type }
      - { from: 6, to: 6, cue: await }
    narration: >-
      Make the page async, type params as a promise, then await it.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: in the App Router, request data is a promise. Did this
      break your upgrade? Follow Frontend Gotchas for more.
