title: Reset React state with one key prop

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Reset React state with the key prop, no useEffect
  hook: New user, but the form still shows the old draft.
  summary: React keeps state by position in the tree, so the same component in the same spot keeps its state even with new props. A key tied to the user ID tells React it is a different form, so it mounts a fresh one.
  fixCode: <ProfileForm key={user.id} user={user} />
  topicTags:
    - react
    - javascript

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: New user. Old draft still in the form.
    subheading: The React key trick
    narration: >-
      You switch to another user's profile, and the form still shows what you
      typed for the last one.

  - type: code
    language: tsx
    code: |
      function Page({ user }) {
        return <ProfileForm user={user} />;
      }
    highlight:
      - { from: 2, to: 2, cue: position }
      - { from: 1, to: 1, cue: props }
    narration: >-
      React keeps state by position in the tree. The same component in the
      same spot is the same instance, so its state survives, even with new
      props.

  - type: code
    language: tsx
    typing: true
    code: |
      function Page({ user }) {
        return (
          <ProfileForm
            key={user.id}
            user={user}
          />
        );
      }
    highlight:
      - { from: 4, to: 4, cue: key }
      - { from: 3, to: 6, cue: different }
    narration: >-
      Give it a key tied to the user ID. A new key tells React this is a
      different form, so it throws the old state away.

  - type: flow
    steps:
      - user.id changes
      - Old form unmounts
      - Fresh form mounts
    narration: >-
      Change the ID, and React unmounts the old form and mounts a clean one.
      No effect needed to reset the fields.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: a new key means a new component. Follow Frontend Gotchas
      for more.
