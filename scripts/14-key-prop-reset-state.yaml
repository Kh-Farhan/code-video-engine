title: Reset React state with one key prop

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Reset React state with the key prop, no useEffect
  hook: You switch users, and the form still shows the old user's text.
  summary: React keeps state by position in the tree, so the same component in the same spot keeps its state even with new props. A key tied to the user ID tells React it is a different form, so it starts fresh.
  fixCode: <ProfileForm key={user.id} user={user} />
  topicTags:
    - react
    - javascript
  level: intermediate

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: "Switched users. Form didn't reset."
    subheading: React state
    narration: >-
      The old user's text stayed.

  - type: code
    language: tsx
    code: |
      function Page({ user }) {
        return <ProfileForm user={user} />;
      }
    highlight:
      - { from: 2, to: 2, cue: position }
      - { from: 1, to: 1, cue: props }
    narration: >-
      You switch users, but the form keeps the old user's draft. Why does it
      survive? [pause] React keeps state by position. Same component, same spot,
      same state, even with new props.

  - type: compare
    language: tsx
    wrong:
      code: |
        <ProfileForm user={user} />
    right:
      code: |
        <ProfileForm key={user.id} user={user} />
    narration: >-
      Give it a key tied to the user ID. A new key tells React it is a
      different form, so it starts fresh.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: a new key means a new component. Have you shipped this
      bug? Follow Frontend Gotchas for more.
