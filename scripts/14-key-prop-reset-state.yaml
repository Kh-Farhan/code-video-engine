title: Reset React state with one key prop

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: One prop resets all state
    subheading: The React key trick
    narration: >-
      The key prop resets a component's state. No effect needed.

  - type: code
    language: tsx
    code: |
      function Page({ user }) {
        return <ProfileForm user={user} />;
      }
    highlight:
      - { from: 1, to: 1, cue: user }
      - { from: 2, to: 2, cue: spot }
    narration: >-
      Switch to another user and the form still shows the last draft. Same
      component, same spot, so React keeps its state.

  - type: code
    language: tsx
    typing: true
    code: |
      function Page({ user }) {
        return (
          <ProfileForm
            key={user.id}
            user={user}
          />
        );
      }
    highlight:
      - { from: 4, to: 4, cue: key }
      - { from: 3, to: 6, cue: component }
    narration: >-
      Add a key tied to the user ID. A new key means a new component, so the
      old state is thrown away.

  - type: flow
    steps:
      - user.id changes
      - Old form unmounts
      - Fresh form mounts
    narration: >-
      Change the ID and React unmounts the old form, then mounts a clean one.

  - type: outro
    cta: New key, fresh state
    narration: >-
      Next time state sticks around, remember:
