title: Why Promise.then runs before setTimeout zero

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: setTimeout 0 is not instant
    subheading: A promise cuts the line
    narration: >-
      setTimeout zero does not run next. A promise cuts in front of it.

  - type: code
    language: javascript
    code: |
      console.log("A");
      setTimeout(() => {
        console.log("B");
      }, 0);
      Promise.resolve().then(() => {
        console.log("C");
      });
      console.log("D");
    highlight:
      - { from: 1, to: 1, cue: A }
      - { from: 2, to: 4, cue: timeout }
      - { from: 5, to: 7, cue: promise }
      - { from: 8, to: 8, cue: D }
    narration: >-
      Guess the order. Log A runs now. The timeout waits. The promise waits
      too. Then D runs.

  - type: output
    command: node order.js
    lines:
      - A
      - D
      - C
      - B
    narration: >-
      A, D, then C before B. The promise wins, even at zero milliseconds.

  - type: flow
    steps:
      - Script ends
      - Drain microtasks
      - Next task
    narration: >-
      Promise callbacks are microtasks. Timers are tasks. After each task, the
      engine drains every microtask before it starts the next task.

  - type: keyword
    keyword: MICROTASKS FIRST
    narration: >-
      So then, await, and queueMicrotask beat any timer.

  - type: outro
    cta: Sync, then microtasks, then tasks
    narration: >-
      Now look at that timeout again.
