title: Why Promise.then runs before setTimeout zero

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: setTimeout 0 is not next
    subheading: A promise cuts the line
    narration: >-
      You set a timeout of zero and expect it to run next. A later promise
      still goes first.

  - type: code
    language: javascript
    code: |
      console.log("A");
      setTimeout(() => {
        console.log("B");
      }, 0);
      Promise.resolve().then(() => {
        console.log("C");
      });
      console.log("D");
    highlight:
      - { from: 1, to: 1, cue: A }
      - { from: 8, to: 8, cue: D }
      - { from: 2, to: 4, cue: timer }
      - { from: 5, to: 7, cue: promise }
    narration: >-
      A and D are plain code, so they run now. The timer callback joins the
      task queue. The promise callback joins the microtask queue.

  - type: flow
    steps:
      - Finish current task
      - Drain all microtasks
      - Take next task
    narration: >-
      The event loop's rule: after each task, run every queued microtask
      until none are left. Only then take the next task.

  - type: output
    command: node order.js
    lines:
      - A
      - D
      - C
      - B
    narration: >-
      So it prints A, D, C, then B. Zero milliseconds still means wait your
      turn.

  - type: compare
    language: javascript
    wrong:
      code: |
        setTimeout(next, 0); // "right after"
    right:
      code: |
        queueMicrotask(next); // before timers
    narration: >-
      Need code to run right after the current script? Use queueMicrotask. It
      joins the promise queue, so it beats any timer.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: microtasks cut the line, timers wait for the next task.
      Follow Frontend Gotchas for more.
