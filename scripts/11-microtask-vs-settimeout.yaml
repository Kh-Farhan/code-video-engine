title: Why Promise.then runs before setTimeout zero

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Why Promise.then runs before setTimeout 0
  hook: A zero millisecond timeout, and a promise written after it still runs first.
  summary: After each task, the event loop runs every queued microtask, like promise callbacks, before it takes the next task, such as a timer. Use queueMicrotask when code has to run right after the current script.
  fixCode: queueMicrotask(next); // runs before any setTimeout
  topicTags:
    - javascript
  level: advanced

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: setTimeout 0 ran after the promise below it
    subheading: Guess the output
    narration: >-
      A zero millisecond timeout, and a promise written after it still runs
      first.

  - type: code
    language: javascript
    code: |
      console.log("A");
      setTimeout(() => {
        console.log("B");
      }, 0);
      Promise.resolve().then(() => {
        console.log("C");
      });
      console.log("D");
    highlight:
      - { from: 1, to: 1, cue: A }
      - { from: 8, to: 8, cue: D }
      - { from: 2, to: 4, cue: timer }
      - { from: 5, to: 7, cue: promise }
    narration: >-
      Guess the order. [pause:800] A and D run right away. The timer joins the
      task queue, the promise joins the microtask queue.

  - type: flow
    steps:
      - Finish current task
      - Drain all microtasks
      - Take next task
    narration: >-
      After each task, the event loop empties the microtask queue before it
      takes the next task.

  - type: output
    command: node order.js
    lines:
      - A
      - D
      - C
      - B
    narration: >-
      So it prints A, D, C, B.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: microtasks cut the line, timers wait their turn. Did you
      guess the order? Follow Frontend Gotchas for more.
