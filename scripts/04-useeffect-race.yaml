title: Your useEffect fetch has a race condition
scenes:
  - type: title
    heading: "Your fetch in useEffect has a race condition"
    subheading: React
    narration: "If you fetch data in useEffect, there's a good chance you have a race condition."
  - type: code
    language: tsx
    code: |
      useEffect(() => {
        fetch(`/api/user/${id}`)
          .then(res => res.json())
          .then(setUser);
      }, [id]);
    highlight: [{from: 2, to: 4}]
    narration: "Change the id quickly, and two requests are in flight. If the older one finishes last, it overwrites the newer data, and you show the wrong user."
  - type: code
    language: tsx
    code: |
      useEffect(() => {
        let ignore = false;
        fetch(`/api/user/${id}`)
          .then(res => res.json())
          .then(data => { if (!ignore) setUser(data); });
        return () => { ignore = true; };
      }, [id]);
    highlight: [{from: 2, to: 2}, {from: 5, to: 5}, {from: 6, to: 6}]
    narration: "Add a flag. The cleanup function sets it when the id changes, so stale responses get ignored. You can also use an AbortController to cancel the request."
  - type: text
    text: "Or let a data library handle it for you."
    narration: "Or use a library like TanStack Query, which handles this for you."
  - type: outro
    cta: Follow for more React tips
    narration: "Follow for more React tips."
