title: Your useEffect fetch has a race condition

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: Click user 2. The page shows user 1.
    subheading: React
    narration: >-
      You switch to another profile, and the page settles on the profile you
      just left.

  - type: code
    language: tsx
    code: |
      useEffect(() => {
        fetch(`/api/user/${id}`)
          .then(res => res.json())
          .then(setUser);
      }, [id]);
    highlight:
      - { from: 5, to: 5, cue: ID }
      - { from: 2, to: 2, cue: fetch }
      - { from: 4, to: 4, cue: setUser }
    narration: >-
      Each time the ID changes, the effect starts a new fetch. The old request
      is never cancelled, and the network keeps no order. Whichever response
      lands last calls setUser and wins.

  - type: flow
    steps:
      - Fetch user 1
      - Fetch user 2
      - User 2 arrives
      - User 1 overwrites
    narration: >-
      Request one is slow. User two shows up first, then user one lands and
      overwrites it.

  - type: code
    language: tsx
    code: |
      useEffect(() => {
        let ignore = false;
        fetch(`/api/user/${id}`)
          .then(res => res.json())
          .then(data => { if (!ignore) setUser(data); });
        return () => { ignore = true; };
      }, [id]);
    highlight:
      - { from: 2, to: 2, cue: flag }
      - { from: 6, to: 6, cue: cleanup }
      - { from: 5, to: 5, cue: ignored }
    narration: >-
      Give each run its own ignore flag. When the ID changes, React runs the
      cleanup first, flipping the flag for the old run. Its late response is
      simply ignored.

  - type: keyword
    keyword: LAST RESPONSE WINS
    narration: >-
      Without a cleanup, the last response wins, not the last request.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: every effect that fetches needs a cleanup. Follow Frontend
      Gotchas for more.
