title: Your useEffect fetch has a race condition

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: Your useEffect fetch has a race condition
    subheading: React
    narration: >-
      Your useEffect fetch can show the wrong user.

  - type: code
    language: tsx
    code: |
      useEffect(() => {
        fetch(`/api/user/${id}`)
          .then(res => res.json())
          .then(setUser);
      }, [id]);
    highlight:
      - { from: 5, to: 5, cue: ID }
      - { from: 2, to: 2, cue: requests }
      - { from: 4, to: 4, cue: setUser }
    narration: >-
      Change the ID fast and two requests race. If the old one lands last,
      setUser shows stale data.

  - type: flow
    steps:
      - Fetch user 1
      - Fetch user 2
      - User 2 arrives
      - User 1 overwrites
    narration: >-
      User two arrives first, then the slower response for user one
      overwrites it.

  - type: code
    language: tsx
    code: |
      useEffect(() => {
        let ignore = false;
        fetch(`/api/user/${id}`)
          .then(res => res.json())
          .then(data => { if (!ignore) setUser(data); });
        return () => { ignore = true; };
      }, [id]);
    highlight:
      - { from: 2, to: 2, cue: flag }
      - { from: 6, to: 6, cue: cleanup }
      - { from: 5, to: 5, cue: ignored }
    narration: >-
      Add an ignore flag. The cleanup flips it when the ID changes, so stale
      responses are ignored.

  - type: list
    items:
      - Ignore flag in cleanup
      - AbortController
      - TanStack Query
    narration: >-
      You can also abort the request outright, or let a data library handle
      it.

  - type: outro
    cta: Clean up every fetch effect
    narration: >-
      Skip the cleanup, and once again,
