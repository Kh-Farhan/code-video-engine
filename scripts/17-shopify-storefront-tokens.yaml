title: Public vs private Storefront API tokens in headless Shopify

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: Never ship the private token
    subheading: Storefront API tokens, public vs private
    narration: >-
      The private Storefront token must never reach the browser. Only the
      public one can.

  - type: compare
    wrong:
      label: Private token in client code
    right:
      label: Public token in client code
    narration: >-
      Public tokens are made for client code. Private tokens stay server
      side.

  - type: code
    language: typescript
    code: |
      // server only
      fetch(storefrontUrl, {
        method: "POST",
        headers: {
          "Shopify-Storefront-Private-Token":
            process.env.PRIVATE_TOKEN,
          "Shopify-Storefront-Buyer-IP":
            buyerIp,
        },
        body,
      });
    highlight:
      - { from: 1, to: 3, cue: server }
      - { from: 5, to: 6, cue: private }
      - { from: 7, to: 8, cue: IP }
    narration: >-
      On your server, send the private token header and forward the shopper's
      IP, so Shopify sees real buyers.

  - type: flow
    steps:
      - Browser
      - Your server
      - Storefront API
    narration: >-
      The browser talks to your server. Only your server talks to Shopify.

  - type: outro
    cta: Public in browser, private on server
    narration: >-
      Check your client bundle now, because
