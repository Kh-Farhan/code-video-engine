title: Why typeof null is 'object'

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Why typeof null is object in JavaScript
  hook: typeof null === 'object', so null slips right through your check.
  summary: The first JavaScript engine stored null as a zero pointer, and a zero type tag meant object. A fix was proposed and rejected, so check null with strict equality and arrays with Array.isArray before trusting typeof.
  fixCode: value !== null && typeof value === 'object';
  topicTags:
    - javascript
  level: beginner

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: typeof null === 'object'
    subheading: JavaScript
    narration: >-
      Null passed your object check.

  - type: flow
    steps:
      - Type tag 0 = object
      - null = pointer 0x00
      - typeof null = object
    narration: >-
      You check that typeof value equals object, and null slips right through.
      Why? [pause] In the first JavaScript engine, every value carried a type
      tag, and zero meant object. Null was stored as a zero pointer, so its tag
      read as object.

  - type: keyword
    keyword: HERE TO STAY
    narration: >-
      A fix was proposed for the language, and it was rejected.

  - type: output
    title: Console
    lines:
      - "> typeof null"
      - "'object'"
      - "> typeof []"
      - "'object'"
      - "> typeof {}"
      - "'object'"
    narration: >-
      What about arrays and plain objects? [pause:800] Both of them give
      object too. So typeof cannot tell the three apart.

  - type: code
    language: javascript
    code: |
      value === null;
      Array.isArray(value);
      value !== null && typeof value === 'object';
    highlight:
      - { from: 1, to: 1, cue: equality }
      - { from: 2, to: 2, cue: isArray }
      - { from: 3, to: 3, cue: rule }
    narration: >-
      Check null with strict equality. Check arrays with Array dot isArray.
      For other objects, rule out null first, then use typeof.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: typeof object means object or null. Have you hit this
      bug? Follow Frontend Gotchas for more.
