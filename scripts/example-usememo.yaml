title: When NOT to use useMemo
scenes:
  - type: title
    heading: Stop wrapping everything in useMemo
    subheading: Three cases where it makes React slower, not faster
    narration: >-
      You probably use useMemo more than you need to.
      Here is when it actually hurts.

  - type: code
    language: tsx
    code: |
      function Cart({ items }) {
        const count = useMemo(() => items.length, [items]);
        const label = useMemo(() => `${count} items`, [count]);
        return <Badge>{label}</Badge>;
      }
    highlight:
      - { from: 2, to: 2 }
      - { from: 3, to: 3 }
    narration: >-
      Case one: cheap calculations. Reading a length or building a short string
      costs almost nothing. The memo adds a dependency check and extra memory
      on every render, so you pay more than you save.

  - type: code
    language: tsx
    typing: true
    code: |
      function Profile({ user }) {
        const style = useMemo(() => ({ color: user.color }), [user]);
        return <div style={style}>{user.name}</div>;
      }
    highlight:
      - { from: 2, to: 2 }
      - { from: 3, to: 3 }
    narration: >-
      Case two: values passed to plain DOM elements. A div does not care
      whether the style object is the same reference, so memoizing it buys
      you nothing.

  - type: text
    text: Case three, the dependencies change every render. Then the memo never hits.
    narration: >-
      Case three: if a dependency is a new object or function on every render,
      the cache misses every single time. You get all of the cost and none of
      the benefit.

  - type: list
    items:
      - The calculation is measurably slow
      - The value goes to a memoized child
      - The value is a dependency of another hook
    narration: >-
      So when should you use it? When the calculation is measurably slow, when
      the value goes to a memoized child, or when it is a dependency of another
      hook.

  - type: outro
    cta: Profile first, then memoize
    narration: >-
      Measure before you memoize. Follow for more React tips that keep your
      code simple.
