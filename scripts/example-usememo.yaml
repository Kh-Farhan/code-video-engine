title: When NOT to use useMemo
scenes:
  - type: title
    heading: Stop wrapping everything in useMemo
    subheading: Three cases where it makes React slower, not faster
    narration: >-
      Most useMemo calls cost more than they save. Here are three.

  - type: code
    language: tsx
    code: |
      function Cart({ items }) {
        const count = useMemo(() => items.length, [items]);
        const label = useMemo(() => `${count} items`, [count]);
        return <Badge>{label}</Badge>;
      }
    highlight:
      - { from: 2, to: 2, cue: length }
      - { from: 3, to: 3, cue: string }
    narration: >-
      One: cheap work. A length or a short string costs nothing, but the memo
      still runs a dependency check every render.

  - type: code
    language: tsx
    typing: true
    code: |
      function Profile({ user }) {
        const style = useMemo(() => ({ color: user.color }), [user]);
        return <div style={style}>{user.name}</div>;
      }
    highlight:
      - { from: 2, to: 2, cue: style }
      - { from: 3, to: 3, cue: div }
    narration: >-
      Two: a memoized style object passed to a plain div. DOM elements never
      compare references, so it buys nothing.

  - type: compare
    language: tsx
    wrong:
      code: |
        const opts = { sort };
        const list = useMemo(
          () => sortItems(items, opts),
          [items, opts],
        );
    right:
      code: |
        const list = useMemo(
          () => sortItems(items, { sort }),
          [items, sort],
        );
    narration: >-
      Three: a dependency that is new every render. The cache always misses.
      Build it inside.

  - type: list
    items:
      - Measured slow math
      - Props for a memo child
      - Deps of another hook
    narration: >-
      Keep it for slow calculations you have measured, values passed to
      memoized children, and dependencies of other hooks.

  - type: outro
    cta: Profile first, then memoize
    narration: >-
      So before your next useMemo, remember:
