title: Why [1, 2, 10].sort() returns [1, 10, 2]

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Why JavaScript sort puts 10 before 2 (and the fix)
  hook: "[1, 2, 10].sort() gives you [1, 10, 2]."
  summary: Without a compare function, sort turns every item into a string and orders them like dictionary words, so "10" lands before "2". Pass a compare function that subtracts, and use toSorted when you want a copy instead of changing the original.
  fixCode: |-
    nums.sort((a, b) => a - b);
    const copy = nums.toSorted((a, b) => a - b);
  topicTags:
    - javascript

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: "[1, 2, 10].sort() gives [1, 10, 2]"
    subheading: JavaScript
    narration: >-
      You sort one, two and ten, and you expect them in order. JavaScript
      hands you one, ten, two.

  - type: flow
    steps:
      - 1, 2, 10
      - '"1", "10", "2"'
      - 1, 10, 2
    narration: >-
      With no compare function, sort turns every item into a string and orders
      them like words in a dictionary, one character at a time.

  - type: output
    title: Console
    lines:
      - "> '10' < '2'"
      - "true"
    narration: >-
      So ten is compared with two as text. The first characters are one and
      two, and one comes first, so ten sorts first.

  - type: code
    language: javascript
    code: |
      nums.sort((a, b) => a - b);
      // negative: a goes first
      // positive: b goes first

      const copy = nums.toSorted((a, b) => a - b);
    highlight:
      - { from: 1, to: 1, cue: compare }
      - { from: 2, to: 2, cue: negative }
      - { from: 3, to: 3, cue: positive }
      - { from: 5, to: 5, cue: toSorted }
    narration: >-
      Pass a compare function that returns a number. Negative puts a first,
      positive puts b first. Sort also changes the original array, so use
      toSorted when you want a copy.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: never sort numbers without a compare function. Follow
      Frontend Gotchas for more.
