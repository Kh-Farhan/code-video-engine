title: Why [1, 2, 10].sort() returns [1, 10, 2]

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Why JavaScript sort puts 10 before 2 (and the fix)
  hook: "[1, 2, 10].sort() gives you [1, 10, 2]."
  summary: Without a compare function, sort turns every item into a string and compares them character by character, so "10" lands before "2". Pass a compare function that returns a minus b to sort numbers smallest first.
  fixCode: nums.sort((a, b) => a - b);
  topicTags:
    - javascript
  level: beginner

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: "[1, 2, 10].sort() gives [1, 10, 2]"
    subheading: JavaScript
    narration: >-
      Sort one, two and ten, and JavaScript hands you one, ten, two.

  - type: flow
    steps:
      - 1, 2, 10
      - '"1", "10", "2"'
      - 1, 10, 2
    narration: >-
      With no compare function, sort turns every number into a string, then
      compares them character by character.

  - type: output
    title: Console
    lines:
      - "> '10' < '2'"
      - "true"
    narration: >-
      Which is smaller, the string ten or the string two? [pause] Ten. Its
      first character, one, comes before two.

  - type: code
    language: javascript
    code: |
      [1, 2, 10].sort();
      // [1, 10, 2]

      [1, 2, 10].sort((a, b) => a - b);
      // [1, 2, 10]
    highlight:
      - { from: 4, to: 4, cue: compare }
      - { from: 5, to: 5, cue: smallest }
    narration: >-
      Pass a compare function. Returning a minus b puts numbers smallest
      first.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: never sort numbers without a compare function. Did this
      one ever bite you? Follow Frontend Gotchas for more.
