title: Using index as a key can scramble your state

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: "React index as key bug: why checkboxes jump rows"
  hook: Add one todo at the top and the checkmark jumps to another row.
  summary: React ties component state to the key, so an index key gives each item's state to a slot in the list instead of to the todo. Key by a stable ID from your data and the state moves with its item.
  fixCode: <TodoItem key={todo.id} todo={todo} />
  topicTags:
    - react
    - javascript

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: Add one todo. The checkmark jumps rows.
    subheading: React lists
    narration: >-
      You add a todo at the top, and the box you just ticked jumps to another
      row.

  - type: code
    language: tsx
    code: |
      function TodoItem({ todo }) {
        const [done, setDone] = useState(false);
        // renders a checkbox and todo.text
      }

      {todos.map((todo, index) => (
        <TodoItem key={index} todo={todo} />
      ))}
    highlight:
      - { from: 2, to: 2, cue: done }
      - { from: 7, to: 7, cue: key }
      - { from: 6, to: 6, cue: index }
    narration: >-
      Each item keeps its own done state. React ties that state to the key,
      not to your data. With the index as the key, the state belongs to a slot
      in the list, not to the todo.

  - type: output
    title: Rendered list
    lines:
      - "key 0  [x] Buy milk"
      - "key 1  [ ] Walk dog"
      - "+ insert Call mom at the top"
      - "key 0  [x] Call mom"
      - "key 1  [ ] Buy milk"
      - "key 2  [ ] Walk dog"
    narration: >-
      Tick Buy milk, then insert Call mom at the top. Key zero still holds the
      tick, so now Call mom looks done instead.

  - type: compare
    language: tsx
    wrong:
      code: |
        <TodoItem key={index} todo={todo} />
    right:
      code: |
        <TodoItem key={todo.id} todo={todo} />
    narration: >-
      Key by a stable ID from your data. Now the key names the todo, so its
      state moves with it.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: a key says who an item is, never where it sits. Follow
      Frontend Gotchas for more.
