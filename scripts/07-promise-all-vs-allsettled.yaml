title: Promise.all vs Promise.allSettled

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Promise.all vs Promise.allSettled in JavaScript
  hook: One request failed and you lost all three results.
  summary: Promise.all rejects the moment any input rejects, so the results that did succeed never reach you. Promise.allSettled waits for every promise and reports each one as fulfilled with a value or rejected with a reason.
  fixCode: const results = await Promise.allSettled(requests);
  topicTags:
    - javascript

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: One request failed. You lost all three.
    subheading: Promise.all vs allSettled
    narration: >-
      Two requests succeed, one fails, and you expect to keep the two that
      worked. Promise dot all gives you none.

  - type: code
    language: javascript
    code: |
      const results = await Promise.all([
        getUser(),
        getOrders(),   // rejects
        getCart(),
      ]);
    highlight:
      - { from: 1, to: 1, cue: all }
      - { from: 3, to: 3, cue: rejects }
      - { from: 2, to: 2, cue: user }
      - { from: 4, to: 4, cue: cart }
    narration: >-
      Promise dot all is all or nothing. Its promise rejects the moment any
      input rejects, with that first error. The user and cart requests still
      finish, but their results never reach you.

  - type: compare
    language: javascript
    wrong:
      code: |
        await Promise.all(requests);
    right:
      code: |
        await Promise.allSettled(requests);
    narration: >-
      Promise dot all settled does not bail out on a failure. It waits for
      every promise to settle, then reports on each one.

  - type: output
    title: Console
    command: console.log(results)
    lines:
      - "{ status: 'fulfilled', value: 'user' }"
      - "{ status: 'rejected', reason: Error }"
      - "{ status: 'fulfilled', value: 'cart' }"
    narration: >-
      Fulfilled with a value, or rejected with a reason, in the order you
      passed them in.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: use all when one failure ruins everything, and all
      settled when partial results still help. Follow Frontend Gotchas for
      more.
