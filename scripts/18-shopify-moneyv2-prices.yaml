title: Stop hardcoding the dollar sign in your Shopify storefront

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: Your euro store says $29.99
    subheading: Shopify prices come as MoneyV2
    narration: >-
      You launch in Europe, and your product page shows a dollar sign next to
      a euro price.

  - type: code
    language: json
    code: |
      {
        "price": {
          "amount": "29.99",
          "currencyCode": "EUR"
        }
      }
    highlight:
      - { from: 2, to: 2, cue: MoneyV2 }
      - { from: 3, to: 3, cue: amount }
      - { from: 4, to: 4, cue: currency }
    narration: >-
      The Storefront API sends prices as MoneyV2. The amount is a decimal
      string, and the currency code travels with it. A hardcoded dollar sign
      throws that code away.

  - type: code
    language: typescript
    typing: true
    code: |
      function formatMoney(m, locale) {
        return new Intl.NumberFormat(locale, {
          style: "currency",
          currency: m.currencyCode,
        }).format(Number(m.amount));
      }
    highlight:
      - { from: 2, to: 4, cue: NumberFormat }
      - { from: 5, to: 5, cue: amount }
    narration: >-
      Pass the code to Intl dot NumberFormat with the shopper's locale, then
      format the amount. It picks the symbol, its position and the separator.

  - type: output
    title: Console
    lines:
      - '> formatMoney(price, "de-DE")'
      - "'29,99 €'"
      - '> formatMoney(price, "en-US")'
      - "'€29.99'"
    narration: >-
      Same price, two locales. German puts the euro sign after, with a comma.
      US English puts it first.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: never print a currency symbol yourself. Format the money
      with its code. Follow Frontend Gotchas for more.
