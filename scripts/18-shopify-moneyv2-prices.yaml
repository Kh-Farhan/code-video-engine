title: Stop hardcoding the dollar sign in your Shopify storefront

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: Stop hardcoding the dollar sign
    subheading: Shopify prices come as MoneyV2
    narration: >-
      A hardcoded dollar sign breaks every non dollar store. The API already
      sends the currency.

  - type: code
    language: json
    code: |
      {
        "price": {
          "amount": "29.99",
          "currencyCode": "EUR"
        }
      }
    highlight:
      - { from: 2, to: 2, cue: MoneyV2 }
      - { from: 3, to: 3, cue: amount }
      - { from: 4, to: 4, cue: currency }
    narration: >-
      Prices come back as MoneyV2: an amount as a decimal string, plus a
      currency code.

  - type: code
    language: typescript
    typing: true
    code: |
      function formatMoney(m, locale) {
        return new Intl.NumberFormat(locale, {
          style: "currency",
          currency: m.currencyCode,
        }).format(Number(m.amount));
      }
    highlight:
      - { from: 2, to: 4, cue: NumberFormat }
      - { from: 5, to: 5, cue: amount }
    narration: >-
      Hand both to Intl dot NumberFormat with the shopper's locale, then
      format the amount.

  - type: output
    title: Console
    lines:
      - '> formatMoney(price, "de-DE")'
      - "'29,99 €'"
      - '> formatMoney(price, "en-US")'
      - "'€29.99'"
    narration: >-
      Same price. Germany puts the euro sign after, with a comma. The US puts
      it first.

  - type: outro
    cta: Format with the currency you get
    narration: >-
      Still tempted to type that symbol? Remember:
