title: Your Next.js Server Action is a public endpoint

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: Server Actions are public endpoints
    subheading: Hiding the button is not auth
    narration: >-
      Every exported Server Action is a public endpoint. Hiding the button
      protects nothing.

  - type: code
    language: javascript
    code: |
      "use server";

      export async function deletePost(id) {
        await db.post.delete({
          where: { id },
        });
      }
    highlight:
      - { from: 1, to: 1, cue: use server }
      - { from: 3, to: 3, cue: deletePost }
      - { from: 4, to: 6, cue: nothing }
    narration: >-
      This file says use server, so deletePost gets an action ID anyone can
      call. And nothing here checks who is asking.

  - type: output
    command: 'curl -X POST site.com/posts -H "Next-Action: 7f3a"'
    lines:
      - HTTP/1.1 200 OK
      - "post 42 deleted"
    narration: >-
      Copy the ID from your page, send a POST with curl, and the post is gone.

  - type: code
    language: javascript
    typing: true
    code: |
      export async function deletePost(id) {
        const user = await getUser();
        if (!user) throw new Error("Login");
        const post = await getPost(id);
        if (post.authorId !== user.id) {
          throw new Error("Forbidden");
        }
        await removePost(id);
      }
    highlight:
      - { from: 2, to: 3, cue: logged }
      - { from: 4, to: 7, cue: own }
    narration: >-
      So check inside the action. First, is anyone logged in? Then, do they
      own this exact post?

  - type: outro
    cta: Auth inside every action
    narration: >-
      Skip that check, and remember:
