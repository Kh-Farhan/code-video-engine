title: Your Next.js Server Action is a public endpoint

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: "Next.js Server Actions are public endpoints: check auth"
  hook: You hid the delete button. Anyone can still delete a post.
  summary: An exported Server Action is reachable by a direct POST request, not just through your UI, whatever your page shows. Check who is logged in and what they own inside the action itself.
  fixCode: |-
    export async function deletePost(id) {
      const user = await getUser();
      if (!user) throw new Error("Login");
      const post = await getPost(id);
      if (post.authorId !== user.id) {
        throw new Error("Forbidden");
      }
      await removePost(id);
    }
  topicTags:
    - nextjs
    - security
  level: advanced

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: Button hidden. Anyone can still delete.
    subheading: Next.js Server Actions
    narration: >-
      Anyone can still delete posts.

  - type: code
    language: javascript
    code: |
      "use server";

      export async function deletePost(id) {
        await db.post.delete({
          where: { id },
        });
      }
    highlight:
      - { from: 1, to: 1, cue: use server }
      - { from: 3, to: 3, cue: exported }
      - { from: 4, to: 6, cue: nothing }
    narration: >-
      You hide the delete button from everyone but admins. How? [pause] Use
      server makes every exported function a Server Action, reachable by a
      direct POST request, not just through your UI. And nothing here checks who
      is asking.

  - type: output
    title: DevTools Network
    lines:
      - "POST /dashboard"
      - "action id: 7f3a9c..."
      - "200 OK"
    narration: >-
      Open the network tab. The action is a plain POST request, and anyone can
      send it again.

  - type: code
    language: javascript
    typing: true
    code: |
      export async function deletePost(id) {
        const user = await getUser();
        if (!user) throw new Error("Login");
        const post = await getPost(id);
        if (post.authorId !== user.id) {
          throw new Error("Forbidden");
        }
        await removePost(id);
      }
    highlight:
      - { from: 2, to: 3, cue: logged }
      - { from: 4, to: 7, cue: own }
    narration: >-
      Check inside the action, because a page check does not cover it. Is
      anyone logged in? Do they own this exact post?

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: treat every Server Action like a public API route. Did you
      check yours? Follow Frontend Gotchas for more.
