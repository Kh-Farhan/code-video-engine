title: Why var in a loop logs the same number three times

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Why var in a for loop logs 3, 3, 3 in JavaScript
  hook: You expect 0, 1, 2. You get 3, 3, 3.
  summary: var is function scoped, so every closure in the loop links to one shared i, and it is already 3 when the timers fire. let creates a fresh i for each iteration, so each callback gets its own.
  fixCode: for (let i = 0; i < 3; i++)
  topicTags:
    - javascript
  level: beginner

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: "Expected 0,1,2. Got 3,3,3."
    subheading: JavaScript loops
    narration: >-
      It logs three, three times.

  - type: code
    language: javascript
    code: |
      for (var i = 0; i < 3; i++) {
        setTimeout(() => {
          console.log(i);
        }, 0);
      }
    highlight:
      - { from: 2, to: 4, cue: callback }
      - { from: 3, to: 3, cue: links }
      - { from: 1, to: 1, cue: var }
    narration: >-
      You expect zero, one, two from this loop. Why does it print three?
      [pause] Each callback links to i itself, not a copy. And var gives the
      whole loop one shared i.

  - type: output
    command: node loop.js
    lines:
      - "3"
      - "3"
      - "3"
    narration: >-
      The timers fire after the loop ends. By then, the shared i is three.

  - type: compare
    language: javascript
    wrong:
      code: |
        for (var i = 0; i < 3; i++)
    right:
      code: |
        for (let i = 0; i < 3; i++)
    narration: >-
      Swap var for let. Each iteration gets its own i, so the loop logs zero,
      one, two.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: closures capture variables, not values. Did you guess
      three? Follow Frontend Gotchas for more.
