title: Why var in a loop logs the same number three times

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: Why does this log 3, 3, 3?
    subheading: var, closures, and loops
    narration: >-
      This loop should log zero, one, two. Instead it logs three, three times.
      Here is why.

  - type: code
    language: javascript
    code: |
      for (var i = 0; i < 3; i++) {
        setTimeout(() => {
          console.log(i);
        }, 0);
      }
    highlight:
      - { from: 1, to: 1 }
      - { from: 2, to: 4 }
    narration: >-
      var is function scoped, so the whole loop shares one i. Every callback
      reads that same variable.

  - type: output
    command: node loop.js
    lines:
      - "3"
      - "3"
      - "3"
    narration: >-
      By the time the timers fire, the loop is done and i is three. So you get
      three, three times.

  - type: compare
    language: javascript
    wrong:
      code: |
        for (var i = 0; i < 3; i++)
    right:
      code: |
        for (let i = 0; i < 3; i++)
    narration: >-
      Swap var for let. A let in a for loop gets a fresh binding on every
      iteration, so each callback keeps its own i.

  - type: output
    command: node loop.js
    lines:
      - "0"
      - "1"
      - "2"
    narration: >-
      Run it again: zero, one, two.

  - type: outro
    cta: Use let in loops, not var
    narration: >-
      One keyword, and the bug is gone. Follow for more JavaScript gotchas.
