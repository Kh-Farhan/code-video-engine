title: Why var in a loop logs the same number three times

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: Why does this log 3, 3, 3?
    subheading: var, closures, and loops
    narration: >-
      This loop logs three, three times. Not zero, one, two.

  - type: code
    language: javascript
    code: |
      for (var i = 0; i < 3; i++) {
        setTimeout(() => {
          console.log(i);
        }, 0);
      }
    highlight:
      - { from: 1, to: 1, cue: var }
      - { from: 2, to: 2, cue: shared }
      - { from: 3, to: 3, cue: callback }
    narration: >-
      The culprit is var. It is function scoped, so the loop has one shared i,
      and every callback reads it later.

  - type: output
    command: node loop.js
    lines:
      - "3"
      - "3"
      - "3"
    narration: >-
      When the timers fire, the loop is done and i is already three.

  - type: compare
    language: javascript
    wrong:
      code: |
        for (var i = 0; i < 3; i++)
    right:
      code: |
        for (let i = 0; i < 3; i++)
    narration: >-
      Swap var for let. Each iteration gets a fresh i, so each callback keeps
      its own.

  - type: output
    command: node loop.js
    lines:
      - "0"
      - "1"
      - "2"
    narration: >-
      Run it again and the numbers count up.

  - type: outro
    cta: let in loops, never var
    narration: >-
      Switch back to var, and once again,
