title: Why var in a loop logs the same number three times

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Why var in a for loop logs 3, 3, 3 in JavaScript
  hook: You expect 0, 1, 2. You get 3, 3, 3.
  summary: var is function scoped, so every closure in the loop links to one shared i, and it is already 3 when the timers fire. let creates a fresh i for each iteration, so each callback gets its own.
  fixCode: for (let i = 0; i < 3; i++)
  topicTags:
    - javascript

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: You expect 0, 1, 2. You get 3, 3, 3.
    subheading: var, closures, and loops
    narration: >-
      You loop from zero to two with a timeout inside and expect zero, one,
      two. It logs three, three times.

  - type: code
    language: javascript
    code: |
      for (var i = 0; i < 3; i++) {
        setTimeout(() => {
          console.log(i);
        }, 0);
      }
    highlight:
      - { from: 2, to: 4, cue: closure }
      - { from: 3, to: 3, cue: link }
      - { from: 1, to: 1, cue: var }
    narration: >-
      Each callback is a closure. It does not copy i, it keeps a live link to
      the variable. And var is function scoped, so the whole loop shares one
      single i.

  - type: output
    command: node loop.js
    lines:
      - "3"
      - "3"
      - "3"
    narration: >-
      The timers fire after the loop ends. By then that one i is three, so
      every callback reads three.

  - type: compare
    language: javascript
    wrong:
      code: |
        for (var i = 0; i < 3; i++)
    right:
      code: |
        for (let i = 0; i < 3; i++)
    narration: >-
      Swap var for let. A let in the loop header is scoped to each iteration,
      so every closure links to its own i.

  - type: output
    command: node loop.js
    lines:
      - "0"
      - "1"
      - "2"
    narration: >-
      Same code, and now it counts up.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: closures capture variables, not values. Follow Frontend
      Gotchas for more.
