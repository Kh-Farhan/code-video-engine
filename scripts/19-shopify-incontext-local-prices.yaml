title: Show local prices with the Shopify inContext directive

style:
  look: aurora
  captions: pop
scenes:
  - type: title
    heading: Why do Canadians see US prices?
    subheading: The @inContext directive
    narration: >-
      Canadians seeing US prices? Shopify Markets alone will not fix a
      headless store.

  - type: flow
    steps:
      - Shopper in Canada
      - "Query with country: CA"
      - Prices in CAD
    narration: >-
      Your query has to name the country. Pass it in, and prices come back in
      Canadian dollars.

  - type: code
    language: typescript
    code: |
      const query = `
        query Price($country: CountryCode)
        @inContext(country: $country) {
          product(handle: "tee") {
            priceRange {
              minVariantPrice {
                amount
                currencyCode
              }
            }
          }
        }`;
    highlight:
      - { from: 3, to: 3, cue: inContext }
      - { from: 2, to: 2, cue: variable }
      - { from: 5, to: 10, cue: price range }
    narration: >-
      Add the inContext directive with a country variable. The price range
      then returns that market's currency, if the market is enabled.

  - type: list
    items:
      - "country: local prices"
      - "language: translations"
      - Cart mutations too
    narration: >-
      It also takes a language for translated content, and it works on cart
      mutations.

  - type: outro
    cta: Pass the country on every query
    narration: >-
      Skip it, and guess who sees US prices.
