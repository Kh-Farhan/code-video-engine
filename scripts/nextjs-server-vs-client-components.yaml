title: Server vs Client Components in Next.js App Router in 60 seconds

# Look and feel: grid, aurora or classic; captions pop or box.
style:
  look: grid
  captions: pop

# Optional: your handle in a corner and on the outro.
# brand:
#   handle: "@yourchannel"

# Narration voice per provider, plus speed for all of them.
# Try --voice am_fenrir or --speed 1.25 to hear other options.
voice:
  kokoro: am_puck
  gemini: Puck
  speed: 1.15

# Demo track generated for this repo (public/music/demo-pad.mp3).
# Swap in your own file under public/music/ any time.
music:
  file: music/demo-pad.mp3
  volume: 0.3
  duckedVolume: 0.08
scenes:
  - type: title
    heading: Stop adding use client everywhere
    subheading: Where App Router components really run
    narration: >-
      Most of your components should never say use client. They run on the
      server by default.

  - type: keyword
    keyword: SERVER BY DEFAULT
    narration: >-
      That is the rule. No directive, no JavaScript shipped.

  - type: code
    language: tsx
    code: |
      // app/products/page.tsx
      export default async function Page() {
        const products = await db.product.findMany();
        return <ProductList products={products} />;
      }
    highlight:
      - { from: 2, to: 2, cue: async }
      - { from: 3, to: 3, cue: database }
      - { from: 4, to: 4, cue: HTML }
    narration: >-
      They can be async, query your database directly, and send plain HTML
      with your secrets kept on the server.

  - type: code
    language: tsx
    typing: true
    code: |
      "use client";

      import { useState } from "react";

      export function LikeButton() {
        const [likes, setLikes] = useState(0);
        const like = () => setLikes(likes + 1);
        return (
          <button onClick={like}>
            {likes} likes
          </button>
        );
      }
    highlight:
      - { from: 1, to: 1, cue: use client }
      - { from: 6, to: 7, cue: state }
      - { from: 9, to: 9, cue: click }
    narration: >-
      Need interactivity? Add use client. Now state and click handlers work,
      and this file ships to the browser.

  - type: list
    items:
      - useState, useEffect
      - onClick handlers
      - window, localStorage
    narration: >-
      Opt in only for state and effects, event handlers, or browser APIs.

  - type: compare
    wrong:
      label: use client on the page
    right:
      label: use client on the button
    narration: >-
      And push it down. Mark the button, not the whole page.

  - type: outro
    cta: Server by default, client at the leaves
    narration: >-
      Type it on a page again, and remember:
