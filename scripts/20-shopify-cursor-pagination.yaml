title: Why your headless Shopify product list stops early

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: Your store is hiding products
    subheading: Cursor pagination in the Storefront API
    narration: >-
      Missing products? Your listing is only showing page one.

  - type: code
    language: typescript
    code: |
      const QUERY = `
      query ($cursor: String) {
        products(first: 50, after: $cursor) {
          nodes { id title }
          pageInfo {
            hasNextPage
            endCursor
          }
        }
      }`;
    highlight:
      - { from: 3, to: 3, cue: first }
      - { from: 6, to: 6, cue: hasNextPage }
      - { from: 7, to: 7, cue: cursor }
    narration: >-
      Each request asks for a page with first, and returns page info with
      hasNextPage and an end cursor.

  - type: stat
    value: "250"
    label: most products per request
    narration: >-
      And first caps out at two hundred fifty.

  - type: code
    language: typescript
    typing: true
    code: |
      const all = [];
      let cursor = null;
      let hasNext = true;
      while (hasNext) {
        const { products } =
          await shop(QUERY, { cursor });
        all.push(...products.nodes);
        const info = products.pageInfo;
        hasNext = info.hasNextPage;
        cursor = info.endCursor;
      }
    highlight:
      - { from: 5, to: 6, cue: after }
      - { from: 7, to: 7, cue: push }
      - { from: 8, to: 10, cue: hasNextPage }
    narration: >-
      To get everything, pass the end cursor back as after, push each page,
      and loop while hasNextPage is true.

  - type: keyword
    keyword: LOAD MORE
    narration: >-
      For a grid, skip the loop. Fetch on scroll.

  - type: outro
    cta: Follow the cursor
    narration: >-
      Skip the cursor, and once again:
