title: Why your headless Shopify product list stops early

# Upload copy for out/<slug>/upload.md. Every field is optional.
meta:
  youtubeTitle: Shopify Storefront API only shows 50 products? Paginate
  hook: 300 products in your shop. Your listing shows 50.
  summary: "Storefront API lists are connections that return one page at a time plus pageInfo, so first: 50 means exactly 50. Loop while hasNextPage is true and pass endCursor back as after to load the rest."
  fixCode: |-
    const all = [];
    let cursor = null;
    let hasNext = true;
    while (hasNext) {
      const { products } =
        await shop(QUERY, { cursor });
      all.push(...products.nodes);
      const info = products.pageInfo;
      hasNext = info.hasNextPage;
      cursor = info.endCursor;
    }
  topicTags:
    - shopify
    - graphql
  level: intermediate

style:
  look: grid
  captions: pop
scenes:
  - type: title
    heading: 300 products. Your listing shows only 50.
    subheading: Shopify Storefront API
    narration: >-
      Your shop has three hundred products, but the listing shows only fifty,
      and nothing errors.

  - type: code
    language: typescript
    code: |
      const QUERY = `
      query ($cursor: String) {
        products(first: 50, after: $cursor) {
          nodes { id title }
          pageInfo {
            hasNextPage
            endCursor
          }
        }
      }`;
    highlight:
      - { from: 3, to: 3, cue: first }
      - { from: 6, to: 6, cue: has next page }
      - { from: 7, to: 7, cue: cursor }
    narration: >-
      Why fifty? [pause] Products is a connection. You ask for one page with
      first, and you get exactly that page, plus page info. Has next page says
      more exist, and the end cursor marks where you stopped.

  - type: stat
    value: "50"
    label: of 300 products shown
    narration: >-
      Ask for fifty, get fifty. The other two hundred fifty never load.

  - type: code
    language: typescript
    typing: true
    code: |
      const all = [];
      let cursor = null;
      let hasNext = true;
      while (hasNext) {
        const { products } =
          await shop(QUERY, { cursor });
        all.push(...products.nodes);
        const info = products.pageInfo;
        hasNext = info.hasNextPage;
        cursor = info.endCursor;
      }
    highlight:
      - { from: 5, to: 6, cue: after }
      - { from: 7, to: 7, cue: nodes }
      - { from: 8, to: 10, cue: has next page }
    narration: >-
      To fetch them all, pass the end cursor back as after, collect each
      page's nodes, and loop while has next page is true.

  - type: outro
    cta: Follow for more gotchas
    narration: >-
      Rule of thumb: a connection gives you one page, never the whole list. Did
      your listing stop at fifty? Follow Frontend Gotchas for more.
